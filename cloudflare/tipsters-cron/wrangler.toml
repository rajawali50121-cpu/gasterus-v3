name = "tipsters-cron"
main = "worker.js"
compatibility_date = "2024-11-14"

# Binding KV untuk cache mentah RapidAPI tipsters (event / market / hasil).
# Buat namespace KV terlebih dahulu melalui dashboard Cloudflare (atau
# `wrangler kv:namespace create TIPSTERS_CACHE`), lalu isi ID-nya di bawah.
[[kv_namespaces]]
binding = "TIPSTERS_CACHE"
id = "TIPSTERS_CACHE_KV_NAMESPACE_ID_DI_ISI_DASHBOARD"

# Jadwal cron (1x sehari, hemat kuota). Default ~00.05 WIB.
# Cron A: 5 17 * * *  -> 00.05 WIB (events + markets terdekat)
# Cron B: 20 17 * * * -> 00.20 WIB (results/settlement feed)
[triggers]
crons = ["5 17 * * *", "20 17 * * *"]

[vars]
# Jumlah event yang diambil market lengkapnya per Cron A.
# Default 3 supaya total request per hari (Cron A x2 + Cron B) = 2*(1+3)+1 = 9 <= 10.
RAPIDAPI_ODDS_MARKET_EVENTS = 3
