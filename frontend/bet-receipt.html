<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Bukti Taruhan — GASTERUS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="stylesheet" href="/css/mobile-blue.css?v=20261019-r2"/>
  <link rel="stylesheet" href="/css/loader-3d.css?v=20260925-1"/>
  <style>
    :root{--line:rgba(255,255,255,.12);--text:#eef3f8;--muted:#9fb0c4;--gold:#e8bd55;--green:#34c98a;--red:#ef6464;--panel:#0e1724}
    *{box-sizing:border-box}
    body{margin:0;background:#050b14;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
    .wrap{max-width:780px;margin:0 auto}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
    .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .brand{font-weight:900;letter-spacing:.08em;font-size:1.05rem}
    .kv{display:grid;grid-template-columns:minmax(130px,36%) 1fr;gap:6px 12px;font-size:.85rem;margin:0}
    .kv dt{color:var(--muted);margin:0}
    .kv dd{margin:0;font-weight:600;word-break:break-word}
    table{width:100%;border-collapse:collapse;font-size:.8rem}
    th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
    th{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:.68rem;letter-spacing:.08em}
    td.num{text-align:right;font-variant-numeric:tabular-nums}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:800}
    .pill.won{background:rgba(52,201,138,.15);color:var(--green)}
    .pill.lost{background:rgba(239,100,100,.15);color:var(--red)}
    .pill.open{background:rgba(232,189,85,.15);color:var(--gold)}
    .totals{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.85rem;margin-top:10px}
    .totals span:nth-child(odd){color:var(--muted)}
    .totals strong{font-variant-numeric:tabular-nums}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    button,.btn{background:#12243a;color:var(--text);border:1px solid #405570;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.85rem}
    .muted{color:var(--muted);font-size:.75rem;line-height:1.6}
    .scroll{overflow-x:auto}
    @media print{
      body{background:#fff;color:#111;padding:0}
      .card{border-color:#ddd;background:#fff}
      .kv dt,.muted,th,.totals span:nth-child(odd){color:#555}
      .no-print{display:none}
      .pill{background:#eee!important;color:#111!important}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div>
          <div class="brand">GASTERUS</div>
          <div class="muted">Bukti Taruhan Togel</div>
        </div>
        <div class="actions no-print">
          <button type="button" id="btn-print">Cetak / Simpan PDF</button>
          <a class="btn" href="/bet-history">Kembali ke Riwayat</a>
        </div>
      </div>
    </div>
    <div class="card" id="receipt">Memuat bukti…</div>
    <p class="muted">Bukti ini dibuat dari data server pada saat halaman dibuka. Simpan sebagai PDF bila perlu klaim atau konfirmasi ke CS, sertakan nomor invoice.</p>
  </div>
  <script type="module" src="/js/loader-3d.js?v=20260925-1"></script>
  <script type="module" src="/js/bet-receipt.js?v=20260930-1"></script>
</body>
</html>
