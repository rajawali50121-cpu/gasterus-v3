<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | CMS</title><link href="enterprise.css?v=20261012-admin-r1" rel="stylesheet"/><script src="api.js?v=20261012-admin-api"></script><script src="admin-shell.js?v=20261012-admin-shell"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000">
<div class="grid" style="grid-template-columns:1fr 1fr"><section class="card"><div class="card-head"><div><h2>Banner Manager</h2><p>Banner hero dan placement lain, tanpa edit HTML.</p></div><button class="btn primary" id="newBanner">+ BANNER</button></div><div class="stack" id="bannerList"></div></section><section class="card"><div class="card-head"><div><h2>Promotion Manager</h2><p>Promo aktif, kode promo, periode tayang, dan CTA.</p></div><button class="btn primary" id="newPromo">+ PROMO</button></div><div class="stack" id="promoList"></div></section></div>
<div class="modal" hidden="" id="bannerModal"><div class="modal-panel"><div class="modal-head"><h2>Banner</h2><button class="btn" data-close="bannerModal">TUTUP</button></div><div class="form-grid"><input id="bId" type="hidden"/><div class="field"><label>Placement</label><select id="bPlacement"><option>HERO</option><option>MEMBER_HOME</option><option>DEPOSIT</option><option>MOBILE</option></select></div><div class="field"><label>Urutan</label><input id="bSort" type="number" value="100"/></div><div class="field full"><label>Judul</label><input id="bTitle"/></div><div class="field full"><label>Subjudul</label><textarea id="bSubtitle"></textarea></div><div class="field full"><label>Gambar</label><input accept="image/png,image/jpeg,image/webp" id="bFile" type="file"/><input id="bImage" placeholder="URL gambar atau data URI"/></div><div class="field"><label>Target URL</label><input id="bTarget" placeholder="deposit.html"/></div><div class="field"><label>Teks Tombol</label><input id="bButton" placeholder="DEPOSIT SEKARANG"/></div><div class="field"><label>Mulai Tayang</label><input id="bStart" type="datetime-local"/></div><div class="field"><label>Selesai Tayang</label><input id="bEnd" type="datetime-local"/></div><div class="field full"><label class="switch-row"><input checked="" id="bActive" style="width:auto;min-height:0" type="checkbox"/> Aktif</label></div></div><div class="preview" id="bPreview" style="margin-top:12px"></div><button class="btn primary" id="saveBanner" style="margin-top:14px">SIMPAN BANNER</button></div></div>
<div class="modal" hidden="" id="promoModal"><div class="modal-panel"><div class="modal-head"><h2>Promotion</h2><button class="btn" data-close="promoModal">TUTUP</button></div><div class="form-grid"><input id="pId" type="hidden"/><div class="field full"><label>Judul</label><input id="pTitle"/></div><div class="field full"><label>Ringkasan</label><textarea id="pSummary"></textarea></div><div class="field full"><label>Detail Promo</label><textarea id="pBody"></textarea></div><div class="field"><label>Kode Promo</label><input id="pCode"/></div><div class="field"><label>Urutan</label><input id="pSort" type="number" value="100"/></div><div class="field full"><label>Gambar</label><input id="pImage" placeholder="URL gambar / data URI"/></div><div class="field full"><label>Target URL</label><input id="pTarget"/></div><div class="field"><label>Mulai</label><input id="pStart" type="datetime-local"/></div><div class="field"><label>Selesai</label><input id="pEnd" type="datetime-local"/></div><div class="field full"><label class="switch-row"><input checked="" id="pActive" style="width:auto;min-height:0" type="checkbox"/> Aktif</label></div></div><button class="btn primary" id="savePromo" style="margin-top:14px">SIMPAN PROMO</button></div></div>
<script>
AdminShell.mount('content.html','CMS & Promotions','Banner • Campaign • Scheduling • Member Content');const esc=AdminShell.esc;let banners=[],promos=[];const dt=v=>v?new Date(v).toISOString().slice(0,16):'';
function render(){bannerList.innerHTML=banners.map(x=>`<div class="card" style="box-shadow:none"><div class="card-head"><div><span class="badge ${x.isActive?'ACTIVE':'SUSPENDED'}">${x.isActive?'LIVE':'OFF'}</span> <b>${esc(x.title)}</b><p>${esc(x.placement)} • order ${esc(x.sortOrder)}</p></div><div class="toolbar"><button class="btn" data-be="${x.id}">EDIT</button><button class="btn red" data-bd="${x.id}">HAPUS</button></div></div>${x.imageUrl?`<img src="${esc(x.imageUrl)}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px">`:''}</div>`).join('')||'<div class="empty">Belum ada banner database. Website masih memakai fallback statis.</div>';promoList.innerHTML=promos.map(x=>`<div class="card" style="box-shadow:none"><div class="card-head"><div><span class="badge ${x.isActive?'ACTIVE':'SUSPENDED'}">${x.isActive?'LIVE':'OFF'}</span> <b>${esc(x.title)}</b><p>${esc(x.promoCode||'Tanpa kode')}</p></div><div class="toolbar"><button class="btn" data-pe="${x.id}">EDIT</button><button class="btn red" data-pd="${x.id}">HAPUS</button></div></div><div class="muted">${esc(x.summary||'')}</div></div>`).join('')||'<div class="empty">Belum ada promo.</div>';}
async function load(){[banners,promos]=await Promise.all([ASEAN_API.request('/admin-api/owner/banners'),ASEAN_API.request('/admin-api/owner/promotions')]);render()}
function bannerForm(x={}){bId.value=x.id||'';bPlacement.value=x.placement||'HERO';bSort.value=x.sortOrder??100;bTitle.value=x.title||'';bSubtitle.value=x.subtitle||'';bImage.value=x.imageUrl||'';bTarget.value=x.targetUrl||'';bButton.value=x.buttonLabel||'';bStart.value=dt(x.startsAt);bEnd.value=dt(x.endsAt);bActive.checked=x.isActive!==false;previewBanner();bannerModal.hidden=false}
function promoForm(x={}){pId.value=x.id||'';pTitle.value=x.title||'';pSummary.value=x.summary||'';pBody.value=x.body||'';pCode.value=x.promoCode||'';pSort.value=x.sortOrder??100;pImage.value=x.imageUrl||'';pTarget.value=x.targetUrl||'';pStart.value=dt(x.startsAt);pEnd.value=dt(x.endsAt);pActive.checked=x.isActive!==false;promoModal.hidden=false}
function previewBanner(){bPreview.innerHTML=bImage.value?`<img src="${esc(bImage.value)}" alt="Preview">`:'Preview banner'};bImage.oninput=previewBanner;bFile.onchange=()=>{const f=bFile.files?.[0];if(!f)return;if(f.size>1800000){alert('Gambar maksimal sekitar 1.8 MB.');return}const r=new FileReader();r.onload=()=>{bImage.value=r.result;previewBanner()};r.readAsDataURL(f)};
newBanner.onclick=()=>bannerForm();newPromo.onclick=()=>promoForm();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).hidden=true);
bannerList.onclick=async e=>{const be=e.target.closest('[data-be]'),bd=e.target.closest('[data-bd]');if(be)bannerForm(banners.find(x=>x.id===be.dataset.be)||{});if(bd&&confirm('Hapus banner ini?')){try{await ASEAN_API.request('/admin-api/owner/banners/'+bd.dataset.bd+'/delete',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:'{}'});await load()}catch(err){alert(err.message)}}};promoList.onclick=async e=>{const pe=e.target.closest('[data-pe]'),pd=e.target.closest('[data-pd]');if(pe)promoForm(promos.find(x=>x.id===pe.dataset.pe)||{});if(pd&&confirm('Hapus promo ini?')){try{await ASEAN_API.request('/admin-api/owner/promotions/'+pd.dataset.pd+'/delete',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:'{}'});await load()}catch(err){alert(err.message)}}};
saveBanner.onclick=async()=>{try{await ASEAN_API.request('/admin-api/owner/banners',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({id:bId.value||undefined,placement:bPlacement.value,sortOrder:Number(bSort.value),title:bTitle.value,subtitle:bSubtitle.value,imageUrl:bImage.value,targetUrl:bTarget.value,buttonLabel:bButton.value,startsAt:bStart.value?new Date(bStart.value).toISOString():null,endsAt:bEnd.value?new Date(bEnd.value).toISOString():null,isActive:bActive.checked})});bannerModal.hidden=true;await load()}catch(e){alert(e.message)}};
savePromo.onclick=async()=>{try{await ASEAN_API.request('/admin-api/owner/promotions',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({id:pId.value||undefined,title:pTitle.value,summary:pSummary.value,body:pBody.value,promoCode:pCode.value,sortOrder:Number(pSort.value),imageUrl:pImage.value,targetUrl:pTarget.value,startsAt:pStart.value?new Date(pStart.value).toISOString():null,endsAt:pEnd.value?new Date(pEnd.value).toISOString():null,isActive:pActive.checked})});promoModal.hidden=true;await load()}catch(e){alert(e.message)}};
(async()=>{try{await AdminShell.auth();await load()}catch(e){location.href='index.html'}})();
</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
