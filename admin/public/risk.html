<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | Risk</title><link href="enterprise.css?v=20261012-admin-r1" rel="stylesheet"/><script src="api.js?v=20261012-admin-api"></script><script src="admin-shell.js?v=20261012-admin-shell"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000">
<div class="grid kpi-grid" id="kpis"></div><section class="card" style="margin-top:14px"><div class="card-head"><div><h2>Fraud &amp; Risk Queue</h2><p>Rule-based signals: failed login, wallet velocity, dan shared payment account.</p></div><div class="toolbar"><select class="btn" id="status"><option>OPEN</option><option>IN_REVIEW</option><option>RESOLVED</option><option>DISMISSED</option><option value="">SEMUA</option></select><button class="btn primary" id="scan">RUN RISK SCAN</button></div></div><div class="table-wrap"><table><thead><tr><th>Severity</th><th>Member</th><th>Category</th><th>Score</th><th>Alert</th><th>Created</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>AdminShell.mount('risk.html','Risk & Fraud','Account takeover • Transaction velocity • Payment duplication');const esc=AdminShell.esc;async function summary(){const s=await ASEAN_API.request('/admin-api/owner/operations-summary');kpis.innerHTML=[['OPEN RISK',s.riskOpen],['HIGH / CRITICAL',s.riskHigh],['SECURITY 24H',s.securityHigh24h],['KYC QUEUE',s.kycQueue]].map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}async function load(){const q='?status='+encodeURIComponent(status.value);const data=await ASEAN_API.request('/admin-api/owner/risk-alerts'+q);rows.innerHTML=data.map(x=>`<tr><td><span class="badge ${esc(x.severity)}">${esc(x.severity)}</span></td><td>${x.memberId?`<a href="player360.html?id=${encodeURIComponent(x.memberId)}" style="color:#ffdc7a">${esc(x.username||x.memberId)}</a>`:'SYSTEM'}</td><td>${esc(x.category)}</td><td><b>${esc(x.score)}</b></td><td><b>${esc(x.title)}</b><div class="muted">${esc(x.description||'')}</div></td><td>${AdminShell.date(x.createdAt)}</td><td>${['OPEN','IN_REVIEW'].includes(x.status)?`<button class="btn blue" data-act="IN_REVIEW" data-id="${x.id}">REVIEW</button> <button class="btn green" data-act="RESOLVED" data-id="${x.id}">RESOLVE</button> <button class="btn" data-act="DISMISSED" data-id="${x.id}">DISMISS</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Risk queue kosong.</td></tr>'}rows.onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const resolution=prompt('Catatan resolusi / review:')||'';try{await ASEAN_API.request('/admin-api/owner/risk-alerts/'+b.dataset.id,{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({status:b.dataset.act,resolution})});await Promise.all([load(),summary()])}catch(x){alert(x.message)}};scan.onclick=async()=>{if(!confirm('Jalankan risk scan sekarang?'))return;try{const r=await ASEAN_API.request('/admin-api/owner/risk-scan',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:'{}'});alert(`Scan selesai. Alert baru: ${r.newAlerts}`);await Promise.all([load(),summary()])}catch(e){alert(e.message)}};status.onchange=()=>load().catch(e=>alert(e.message));(async()=>{try{await AdminShell.auth();await Promise.all([load(),summary()])}catch(e){alert(e.message)}})();</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
