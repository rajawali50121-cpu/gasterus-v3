<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | Support</title><link href="enterprise.css?v=20261012-admin-r1" rel="stylesheet"/><script src="api.js?v=20261012-admin-api"></script><script src="admin-shell.js?v=20261012-admin-shell"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000">
<section class="card"><div class="card-head"><div><h2>Support Case Queue</h2><p>Case management terpusat untuk permintaan member.</p></div><select class="btn" id="status"><option value="">SEMUA</option><option>OPEN</option><option>ASSIGNED</option><option>WAITING_MEMBER</option><option>RESOLVED</option><option>CLOSED</option></select></div><div class="table-wrap"><table><thead><tr><th>Case</th><th>Member</th><th>Priority</th><th>Category</th><th>Subject</th><th>Status</th><th>Created</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>AdminShell.mount('support.html','Support Center','Tickets • Assignment • Resolution trail');const esc=AdminShell.esc;async function load(){const q=status.value?'?status='+encodeURIComponent(status.value):'';const d=await ASEAN_API.request('/admin-api/owner/support-cases'+q);rows.innerHTML=d.map(x=>`<tr><td class="mono">${esc(x.caseNumber)}</td><td><a style="color:#ffdc7a" href="player360.html?id=${encodeURIComponent(x.memberId)}">${esc(x.username)}</a></td><td><span class="badge ${esc(x.priority)}">${esc(x.priority)}</span></td><td>${esc(x.category)}</td><td><b>${esc(x.subject)}</b><div class="muted">${esc(x.description).slice(0,100)}</div></td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td>${AdminShell.date(x.createdAt)}</td><td>${!['RESOLVED','CLOSED'].includes(x.status)?`<button class="btn blue" data-id="${x.id}" data-s="ASSIGNED">ASSIGN</button> <button class="btn" data-id="${x.id}" data-s="WAITING_MEMBER">WAIT</button> <button class="btn green" data-id="${x.id}" data-s="RESOLVED">RESOLVE</button>`:`<button class="btn" data-id="${x.id}" data-s="CLOSED">CLOSE</button>`}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Case queue kosong.</td></tr>'}rows.onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;let resolution='';if(['RESOLVED','CLOSED'].includes(b.dataset.s))resolution=prompt('Resolusi kasus:')||'';try{await ASEAN_API.request('/admin-api/owner/support-cases/'+b.dataset.id,{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({status:b.dataset.s,priority:'NORMAL',resolution})});await load()}catch(x){alert(x.message)}};status.onchange=()=>load().catch(e=>alert(e.message));(async()=>{try{await AdminShell.auth();await load()}catch(e){alert(e.message)}})();</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
