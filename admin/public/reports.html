<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | Reports</title><link href="enterprise.css?v=20261012-admin-r1" rel="stylesheet"/><script src="api.js?v=20261012-admin-api"></script><script src="admin-shell.js?v=20261012-admin-shell"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000">
<div class="toolbar" style="margin-bottom:14px"><select class="btn" id="days"><option value="7">7 HARI</option><option selected="" value="30">30 HARI</option><option value="60">60 HARI</option><option value="90">90 HARI</option></select><button class="btn primary" id="exportCsv">EXPORT CSV</button></div><div class="grid kpi-grid" id="kpis"></div><section class="card" style="margin-top:14px"><div class="card-head"><div><h2>Daily Finance Report</h2><p>Deposit approved, withdraw approved, dan queue harian.</p></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Deposits</th><th>Withdraws</th><th>Net</th><th>Pending Requests</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>AdminShell.mount('reports.html','Report Center','Finance • Players • Risk • Support • Betting');const esc=AdminShell.esc;let report=null;async function load(){report=await ASEAN_API.request('/admin-api/owner/reports?days='+days.value);kpis.innerHTML=[['TOTAL MEMBER',report.members.total],['ACTIVE MEMBER',report.members.active],['NEW TODAY',report.members.new_today],['OPEN RISK',report.risk.open],['HIGH RISK',report.risk.high],['OPEN SUPPORT',report.support.open],['LOTTERY STAKE',ASEAN_API.money(report.betting.lotteryStake)],['SPORTSBOOK STAKE',ASEAN_API.money(report.betting.sportsbookStake)]].map(x=>`<div class="kpi"><small>${esc(x[0])}</small><strong style="font-size:20px">${esc(x[1])}</strong></div>`).join('');rows.innerHTML=report.daily.map(x=>`<tr><td>${esc(String(x.date).slice(0,10))}</td><td>${ASEAN_API.money(x.deposits)}</td><td>${ASEAN_API.money(x.withdraws)}</td><td>${ASEAN_API.money(x.deposits-x.withdraws)}</td><td>${esc(x.pending)}</td></tr>`).join('')}days.onchange=()=>load().catch(e=>alert(e.message));exportCsv.onclick=()=>{if(!report)return;const lines=[['date','deposits','withdraws','net','pending'],...report.daily.map(x=>[String(x.date).slice(0,10),x.deposits,x.withdraws,x.deposits-x.withdraws,x.pending])].map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines],{type:'text/csv'}));a.download=`gasterus-report-${days.value}d.csv`;a.click();URL.revokeObjectURL(a.href)};(async()=>{try{await AdminShell.auth();await load()}catch(e){alert(e.message)}})();</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
