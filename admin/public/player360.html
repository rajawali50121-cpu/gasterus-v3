<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | Player 360</title><link href="enterprise.css?v=20261012-admin-r1" rel="stylesheet"/><script src="api.js?v=20261012-admin-api"></script><script src="admin-shell.js?v=20261012-admin-shell"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000">
<div class="toolbar" style="margin-bottom:14px"><button class="btn" onclick="history.back()">← KEMBALI</button><button class="btn" id="refresh">REFRESH 360</button></div><div id="head"></div><div class="grid kpi-grid" id="kpis" style="margin-top:14px"></div>
<div class="split" style="margin-top:14px"><section class="card"><div class="card-head"><div><h2>Compliance / KYC</h2><p>Metadata verifikasi dan status review.</p></div></div><div class="grid kpi-grid" id="complianceKpis"></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>Status</label><select id="kycStatus"><option>PENDING</option><option>REVIEW</option><option>VERIFIED</option><option>REJECTED</option></select></div><div class="field"><label>Document Type</label><input id="documentType" placeholder="KTP / Passport / Provider check"/></div><div class="field"><label>Document Reference</label><input id="documentReference" placeholder="Reference ID, bukan file dokumen"/></div><div class="field"><label>Provider</label><input id="providerName" placeholder="Verification provider"/></div><div class="field"><label>Provider Reference</label><input id="providerReference"/></div><div class="field"><label>Notes</label><input id="kycNotes"/></div></div><button class="btn primary" id="saveKyc" style="margin-top:12px">SAVE KYC REVIEW</button></section>
<section class="card"><div class="card-head"><div><h2>Responsible Play</h2><p>Limit langsung dan account restriction.</p></div></div><div class="form-grid"><div class="field"><label>Daily Deposit</label><input id="dailyDeposit" inputmode="numeric"/></div><div class="field"><label>Weekly Deposit</label><input id="weeklyDeposit" inputmode="numeric"/></div><div class="field"><label>Monthly Deposit</label><input id="monthlyDeposit" inputmode="numeric"/></div><div class="field"><label>Daily Spend</label><input id="dailySpend" inputmode="numeric"/></div><div class="field"><label>Session Minutes</label><input id="sessionMinutes" inputmode="numeric"/></div><div class="field"><label>Cooling Off Until</label><input id="cooling" type="datetime-local"/></div><div class="field full"><label>Self Excluded Until</label><input id="selfExcluded" type="datetime-local"/></div></div><button class="btn primary" id="saveResponsible" style="margin-top:12px">SAVE RESPONSIBLE CONTROLS</button></section></div>
<div class="split" style="margin-top:14px"><section class="card"><div class="card-head"><div><h2>Risk Alerts</h2></div></div><div class="table-wrap"><table><thead><tr><th>Severity</th><th>Category</th><th>Score</th><th>Status</th><th>Created</th></tr></thead><tbody id="riskRows"></tbody></table></div></section><section class="card"><div class="card-head"><div><h2>Support Cases</h2></div></div><div class="table-wrap"><table><thead><tr><th>Case</th><th>Priority</th><th>Status</th><th>Subject</th></tr></thead><tbody id="caseRows"></tbody></table></div></section></div>
<div class="split" style="margin-top:14px"><section class="card"><div class="card-head"><div><h2>Recent Ledger</h2></div></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Direction</th><th>Amount</th><th>Balance</th><th>Reason</th></tr></thead><tbody id="ledgerRows"></tbody></table></div></section><section class="card"><div class="card-head"><div><h2>Security History</h2></div></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Severity</th><th>Event</th><th>IP</th></tr></thead><tbody id="securityRows"></tbody></table></div></section></div>
<script>AdminShell.mount('members.html','Player 360','Profile • Compliance • Wallet • Risk • Support • Security');const esc=AdminShell.esc;const id=new URLSearchParams(location.search).get('id');let data=null;if(!id)location.href='members.html';const n=v=>v===null||v===undefined?'':String(v);const localInput=v=>v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';async function load(){data=await ASEAN_API.request('/admin-api/owner/members/'+encodeURIComponent(id)+'/player360');head.innerHTML=`<section class="card"><div class="card-head"><div><h2>${esc(data.username)}</h2><p class="mono">${esc(data.id)} • ${esc(data.email||'-')} • ${esc(data.phone||'-')}</p></div><div><span class="badge ${esc(data.status)}">${esc(data.status)}</span> <span class="badge ${esc(data.compliance?.kycStatus||'UNVERIFIED')}">${esc(data.compliance?.kycStatus||'UNVERIFIED')}</span></div></div></section>`;kpis.innerHTML=[['BALANCE',ASEAN_API.money(data.balance)],['RISK',`${data.compliance?.riskScore||0} / ${data.compliance?.riskLevel||'LOW'}`],['LOTTERY BETS',data.activity?.lottery_bets||0],['SPORTSBOOK BETS',data.activity?.sportsbook_bets||0],['DEPOSITS',data.activity?.deposits||0],['WITHDRAWS',data.activity?.withdraws||0],['SUPPORT CASES',(data.supportCases||[]).length],['KYC REVIEWS',(data.kycReviews||[]).length]].map(x=>`<div class="kpi"><small>${esc(x[0])}</small><strong style="font-size:19px">${esc(x[1])}</strong></div>`).join('');complianceKpis.innerHTML=[['KYC',data.compliance?.kycStatus||'UNVERIFIED'],['RISK SCORE',data.compliance?.riskScore||0],['PROVIDER',data.compliance?.verificationProvider||'-'],['LAST REVIEW',data.compliance?.lastReviewedAt?new Date(data.compliance.lastReviewedAt).toLocaleDateString('id-ID'):'-']].map(x=>`<div class="kpi"><small>${x[0]}</small><strong style="font-size:15px">${esc(x[1])}</strong></div>`).join('');const rp=data.responsiblePlay||{};dailyDeposit.value=n(rp.depositDailyLimit);weeklyDeposit.value=n(rp.depositWeeklyLimit);monthlyDeposit.value=n(rp.depositMonthlyLimit);dailySpend.value=n(rp.spendDailyLimit);sessionMinutes.value=n(rp.sessionMinutesLimit);cooling.value=localInput(rp.coolingOffUntil);selfExcluded.value=localInput(rp.selfExcludedUntil);riskRows.innerHTML=(data.riskAlerts||[]).map(x=>`<tr><td><span class="badge ${esc(x.severity)}">${esc(x.severity)}</span></td><td>${esc(x.category)}</td><td>${esc(x.score)}</td><td>${esc(x.status)}</td><td>${AdminShell.date(x.created_at||x.createdAt)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Tidak ada alert.</td></tr>';caseRows.innerHTML=(data.supportCases||[]).map(x=>`<tr><td class="mono">${esc(x.case_number||x.caseNumber)}</td><td>${esc(x.priority)}</td><td>${esc(x.status)}</td><td>${esc(x.subject)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Tidak ada case.</td></tr>';ledgerRows.innerHTML=(data.ledger||[]).map(x=>`<tr><td>${AdminShell.date(x.createdAt)}</td><td>${esc(x.direction)}</td><td>${ASEAN_API.money(x.amount)}</td><td>${ASEAN_API.money(x.balanceAfter)}</td><td>${esc(x.reason)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Ledger kosong.</td></tr>';securityRows.innerHTML=(data.securityEvents||[]).map(x=>`<tr><td>${AdminShell.date(x.created_at||x.createdAt)}</td><td><span class="badge ${esc(x.severity)}">${esc(x.severity)}</span></td><td>${esc(x.event_type||x.eventType)}</td><td class="mono">${esc(x.ip_address||x.ipAddress||'-')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Tidak ada event.</td></tr>'}saveKyc.onclick=async()=>{try{await ASEAN_API.request('/admin-api/owner/members/'+id+'/kyc',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({status:kycStatus.value,documentType:documentType.value,documentReference:documentReference.value,providerName:providerName.value,providerReference:providerReference.value,notes:kycNotes.value})});alert('KYC review tersimpan.');await load()}catch(e){alert(e.message)}};saveResponsible.onclick=async()=>{const val=id=>{const v=document.getElementById(id).value.trim();return v?Number(v.replace(/\D/g,'')):null};try{await ASEAN_API.request('/admin-api/owner/members/'+id+'/responsible-play',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({depositDailyLimit:val('dailyDeposit'),depositWeeklyLimit:val('weeklyDeposit'),depositMonthlyLimit:val('monthlyDeposit'),spendDailyLimit:val('dailySpend'),sessionMinutesLimit:val('sessionMinutes'),coolingOffUntil:cooling.value?new Date(cooling.value).toISOString():null,selfExcludedUntil:selfExcluded.value?new Date(selfExcluded.value).toISOString():null})});alert('Responsible controls diperbarui.');await load()}catch(e){alert(e.message)}};refresh.onclick=()=>load().catch(e=>alert(e.message));(async()=>{try{await AdminShell.auth();await load()}catch(e){alert(e.message)}})();</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
