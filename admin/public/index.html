<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>GASTERUS | Owner Login</title><link rel="stylesheet" href="owner-v2.css?v=1"><style>body.login{display:grid;place-items:center;min-height:100vh;padding:20px}.loginbox{width:min(430px,100%);background:#121a2b;border:1px solid #26344b;border-radius:18px;padding:34px;box-shadow:0 24px 80px #0008}.mark{font-size:34px;font-weight:900;color:#e8bd55}.mark span{color:#fff}.loginbox h1{font-size:25px;margin:22px 0 6px}.loginbox p{color:#91a0b8;margin:0 0 26px}.loginbox label{display:block;color:#91a0b8;font-size:12px;margin:15px 0 7px}.loginbox input{width:100%;margin-top:7px}.loginbox button{width:100%;margin-top:22px;background:#e8bd55;color:#17130a;border:0;border-radius:9px;padding:13px;font-weight:800}.msg{color:#ff9da4!important;min-height:20px;margin-top:12px!important}</style><script src="login.js?v=owner-v2" defer></script></head>
<body class="login"><form class="loginbox" id="loginForm"><div class="mark">G<span>.</span></div><h1>Owner Sign In</h1><p>Masuk ke pusat kendali GASTERUS.</p><label>Username<input id="username" name="username" autocomplete="username" value="gasterusowner" required></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label><button id="loginButton" type="submit">MASUK KE PANEL</button><p class="msg" id="loginMessage" role="alert" aria-live="polite"></p></form></body></html>
