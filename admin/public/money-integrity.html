<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | Money Integrity</title><link href="enterprise.css?v=20261012-admin-r1" rel="stylesheet"/><script src="api.js?v=20261012-admin-api"></script><script src="admin-shell.js?v=20261012-admin-shell"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000">
<div class="grid kpi-grid" id="kpis"></div>
<section class="card" style="margin-top:14px"><div class="card-head"><div><h2>Real-Money Integrity Monitor</h2><p>Ledger invariant • Withdrawal reservation • Provider confirmation • Controlled reversal.</p></div><button class="btn primary" id="reload">REFRESH</button></div><div class="notice" id="ledgerBox"></div></section>
<section class="card" style="margin-top:14px"><div class="card-head"><div><h2>Recent Money Requests</h2><p>Reversal wajib memakai second approval dan hanya tersedia untuk transaksi settled.</p></div></div><div class="table-wrap"><table><thead><tr><th>Member</th><th>Jenis</th><th>Nominal</th><th>Status</th><th>Funds</th><th>Provider</th><th>Created</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>
AdminShell.mount('money-integrity.html','Money Integrity','Real-money transaction control • Ledger • Holds • Reversal');const esc=AdminShell.esc;let data;
async function requestReversal(id){const reason=prompt('Alasan reversal (wajib jelas):','External settlement failed / transaction correction');if(!reason||reason.trim().length<8)return;try{const r=await ASEAN_API.request('/admin-api/owner/wallet-requests/'+id+'/reversal',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({reason})});alert('Reversal masuk second approval: '+r.id);await load()}catch(e){alert(e.message)}}
async function load(){data=await ASEAN_API.request('/admin-api/owner/money-integrity');kpis.innerHTML=[['LEDGER',data.ledger.balanced?'BALANCED':'CHECK'],['RESERVED WD',data.reserved_withdrawals],['RESERVED AMOUNT',ASEAN_API.money(data.reserved_amount)],['STALE >2H',data.stale_requests],['PROVIDER CONFIRMED PENDING',data.provider_confirmed_pending],['REVERSED',data.reversed_requests]].map(x=>`<div class="kpi"><small>${esc(x[0])}</small><strong>${esc(x[1])}</strong></div>`).join('');ledgerBox.innerHTML=data.ledger.balanced?'<span class="success-text"><b>Double-entry ledger balanced.</b></span> No imbalance, arithmetic error, or account drift detected.':`<span class="danger-text"><b>Ledger integrity warning.</b></span><pre>${esc(JSON.stringify(data.ledger,null,2))}</pre>`;rows.innerHTML=(data.recent||[]).map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.requestType)}</td><td>${ASEAN_API.money(x.amount)}</td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td>${esc(x.fundsState)}</td><td>${esc(x.providerCode||'-')}<br><span class="muted mono">${esc(x.providerStatus||x.providerReference||'')}</span></td><td>${AdminShell.date(x.createdAt)}</td><td>${x.status==='APPROVED'&&x.fundsState==='SETTLED'?`<button class="btn red" data-reverse="${esc(x.id)}">REQUEST REVERSAL</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Belum ada transaksi.</td></tr>'}
rows.onclick=e=>{const b=e.target.closest('[data-reverse]');if(b)requestReversal(b.dataset.reverse)};reload.onclick=()=>load().catch(e=>alert(e.message));(async()=>{try{await AdminShell.auth();await load()}catch(e){alert(e.message)}})();
</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
