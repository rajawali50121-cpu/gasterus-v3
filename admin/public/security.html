<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | Security</title><link href="enterprise.css?v=20261012-admin-r1" rel="stylesheet"/><script src="api.js?v=20261012-admin-api"></script><script src="admin-shell.js?v=20261012-admin-shell"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000">
<div class="grid kpi-grid" id="kpis"></div><section class="card" style="margin-top:14px"><div class="card-head"><div><h2>Security Event Stream</h2><p>Login success/failure, MFA failure, blocked account, dan event keamanan lainnya.</p></div><select class="btn" id="severity"><option value="">SEMUA SEVERITY</option><option>INFO</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Severity</th><th>Channel</th><th>Event</th><th>User</th><th>IP</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>AdminShell.mount('security.html','Security Operations','Authentication telemetry • High severity events • Audit support');const esc=AdminShell.esc;async function load(){const [d,s]=await Promise.all([ASEAN_API.request('/admin-api/owner/security-events?limit=500'+(severity.value?'&severity='+encodeURIComponent(severity.value):'')),ASEAN_API.request('/admin-api/owner/operations-summary')]);kpis.innerHTML=[['HIGH EVENTS 24H',s.securityHigh24h],['OPEN RISK',s.riskOpen],['HIGH RISK',s.riskHigh],['KYC QUEUE',s.kycQueue]].map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');rows.innerHTML=d.map(x=>`<tr><td>${AdminShell.date(x.createdAt)}</td><td><span class="badge ${esc(x.severity)}">${esc(x.severity)}</span></td><td>${esc(x.channel)}</td><td>${esc(x.eventType)}</td><td>${esc(x.username||'-')}</td><td class="mono">${esc(x.ipAddress||'-')}</td><td class="mono">${esc(JSON.stringify(x.details||{})).slice(0,160)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Belum ada security event.</td></tr>'}severity.onchange=()=>load().catch(e=>alert(e.message));(async()=>{try{await AdminShell.auth();await load()}catch(e){alert(e.message)}})();</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
