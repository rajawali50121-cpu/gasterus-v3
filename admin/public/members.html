<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | Members</title><link href="enterprise.css?v=20261012-admin-r1" rel="stylesheet"/><script src="api.js?v=20261012-admin-api"></script><script src="admin-shell.js?v=20261012-admin-shell"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000">
<section class="card"><div class="card-head"><div><h2>Member Directory</h2><p>Search, inspect, suspend, edit profile, reset credentials, dan revoke session.</p></div><div class="toolbar"><input class="btn search" id="search" placeholder="Cari username / email / phone"/><button class="btn" id="reload">REFRESH</button></div></div><div class="table-wrap"><table><thead><tr><th>Member</th><th>Email / Phone</th><th>Balance</th><th>Status</th><th>Registered</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="modal" hidden="" id="memberModal"><div class="modal-panel"><div class="modal-head"><div><h2 id="modalTitle">Member</h2><div class="muted" id="memberMeta"></div></div><button class="btn" id="closeModal">TUTUP</button></div><div class="grid kpi-grid" id="memberKpis"></div><div class="card" style="margin-top:14px"><div class="form-grid"><div class="field"><label>Email</label><input id="email"/></div><div class="field"><label>Phone</label><input id="phone"/></div><div class="field"><label>Bank Member</label><input id="bankName"/></div><div class="field"><label>Nama Rekening</label><input id="accountName"/></div><div class="field full"><label>Nomor Rekening</label><input id="accountNumber"/></div></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="saveProfile">SIMPAN PROFIL</button><button class="btn red" id="toggleStatus"></button><button class="btn blue" id="revoke">REVOKE SESSION</button><button class="btn" id="resetPassword">RESET PASSWORD</button></div></div><section class="card" style="margin-top:14px"><div class="card-head"><div><h2>Ledger Terbaru</h2></div></div><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Type</th><th>Amount</th><th>Balance</th></tr></thead><tbody id="ledgerRows"></tbody></table></div></section></div></div>
<script>
AdminShell.mount('members.html','Member Management','CRM • Account Security • Wallet Visibility');const esc=AdminShell.esc;let all=[],current=null;
function render(){const q=search.value.trim().toLowerCase();const data=all.filter(x=>!q||[x.username,x.email,x.phone].some(v=>String(v||'').toLowerCase().includes(q)));rows.innerHTML=data.map(x=>`<tr><td><b>${esc(x.username)}</b><div class="mono muted">${esc(x.id)}</div></td><td>${esc(x.email||'-')}<br><span class="muted">${esc(x.phone||'-')}</span></td><td>${ASEAN_API.money(x.balance)}</td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td>${AdminShell.date(x.createdAt)}</td><td><button class="btn" data-open="${esc(x.id)}">DETAIL</button> <button class="btn primary" data-360="${esc(x.id)}">360</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Member tidak ditemukan.</td></tr>';}
async function load(){all=await ASEAN_API.request('/admin-api/owner/members?limit=500');render();}
async function openMember(id){current=await ASEAN_API.request('/admin-api/owner/members/'+id);modalTitle.textContent=current.username;memberMeta.textContent=current.id;email.value=current.email||'';phone.value=current.phone||'';bankName.value=current.bankName||'';accountName.value=current.accountName||'';accountNumber.value=current.accountNumber||'';toggleStatus.textContent=current.status==='ACTIVE'?'SUSPEND MEMBER':'AKTIFKAN MEMBER';toggleStatus.className=current.status==='ACTIVE'?'btn red':'btn green';memberKpis.innerHTML=[['BALANCE',ASEAN_API.money(current.balance)],['STATUS',current.status],['ROLE',(current.roles||[]).join(', ')||'MEMBER'],['REGISTERED',new Date(current.createdAt).toLocaleDateString('id-ID')]].map(x=>`<div class="kpi"><small>${esc(x[0])}</small><strong style="font-size:18px">${esc(x[1])}</strong></div>`).join('');ledgerRows.innerHTML=(current.ledger||[]).map(x=>`<tr><td>${AdminShell.date(x.createdAt||x.created_at)}</td><td>${esc(x.transactionType||x.transaction_type||'-')}</td><td>${ASEAN_API.money(x.amount||x.amountSigned||0)}</td><td>${ASEAN_API.money(x.balanceAfter||0)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada ledger.</td></tr>';memberModal.hidden=false;}
rows.onclick=e=>{const p=e.target.closest('[data-360]');if(p){location.href='player360.html?id='+encodeURIComponent(p.dataset['360']);return}const b=e.target.closest('[data-open]');if(b)openMember(b.dataset.open).catch(x=>alert(x.message))};search.oninput=render;reload.onclick=()=>load().catch(x=>alert(x.message));closeModal.onclick=()=>memberModal.hidden=true;memberModal.onclick=e=>{if(e.target===memberModal)memberModal.hidden=true};
saveProfile.onclick=async()=>{if(!current)return;try{await ASEAN_API.request('/admin-api/owner/members/'+current.id+'/profile',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({email:email.value,phone:phone.value,bankName:bankName.value,accountName:accountName.value,accountNumber:accountNumber.value})});alert('Profil member diperbarui.');await load();await openMember(current.id)}catch(e){alert(e.message)}};
toggleStatus.onclick=async()=>{if(!current)return;const status=current.status==='ACTIVE'?'SUSPENDED':'ACTIVE';if(!confirm(`${status==='SUSPENDED'?'Suspend':'Aktifkan'} member ${current.username}?`))return;try{await ASEAN_API.request('/admin-api/owner/members/'+current.id+'/status',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({status})});await load();await openMember(current.id)}catch(e){alert(e.message)}};
revoke.onclick=async()=>{if(!current||!confirm('Putuskan seluruh sesi login member ini?'))return;try{const d=await ASEAN_API.request('/admin-api/owner/members/'+current.id+'/revoke-sessions',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:'{}'});alert('Session revoked: '+d.revoked)}catch(e){alert(e.message)}};
resetPassword.onclick=async()=>{if(!current)return;const p=prompt('Password baru minimal 10 karakter:');if(!p)return;if(!confirm('Reset password dan logout semua sesi member?'))return;try{await ASEAN_API.request('/admin-api/owner/members/'+current.id+'/reset-password',{method:'POST',headers:{'x-csrf-token':ASEAN_API.csrf},body:JSON.stringify({password:p})});alert('Password berhasil di-reset dan sesi lama dicabut.')}catch(e){alert(e.message)}};
(async()=>{try{await AdminShell.auth();await load()}catch(e){location.href='index.html'}})();
</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
