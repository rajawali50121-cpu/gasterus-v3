<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | Persetujuan</title><style>:root{--bg:#07111f;--panel:#101d30;--line:#2c405a;--gold:#e2b84f;--text:#eef3f8;--muted:#92a2b6;--green:#29b56d;--red:#df5a62}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0b1728);color:var(--text);font-family:Arial}.top{position:sticky;top:0;z-index:20;padding:15px 22px;background:#050c15;border-bottom:2px solid #b48a25;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;color:#f3d47a}.nav{display:flex;gap:8px}.btn{padding:9px 12px;border:1px solid #405570;border-radius:7px;color:#fff;background:#12243a;cursor:pointer}.green{background:#174d32}.red{background:#551f27}.wrap{max-width:1400px;margin:auto;padding:22px 16px}.card{padding:18px;border:1px solid var(--line);border-radius:12px;background:rgba(16,29,48,.97);box-shadow:0 10px 30px rgba(0,0,0,.25)}.notice{padding:13px;border:1px solid #66511f;border-radius:9px;background:#211b0c;color:#f5dc8a;margin-bottom:16px}.table-wrap{overflow:auto}table{width:100%;min-width:1100px;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{color:var(--gold)}pre{white-space:pre-wrap;max-width:360px}.badge{padding:5px 8px;border-radius:999px;background:#654e18;font-weight:900;font-size:10px}</style><script src="api.js?v=20261012-admin-api"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000"><header class="top"><div class="brand">SBOTOTO ADMIN • PERSETUJUAN</div><nav class="nav"><button class="btn" data-href="dashboard.html">DASHBOARD</button><button class="btn" data-href="members.html">MEMBERS</button><button class="btn" data-href="payments.html">PAYMENTS</button><button class="btn" data-href="content.html">CMS</button><button class="btn" data-href="bets.html">BETTING</button><button class="btn" data-href="lottery-control.html">LOTTERY RISK</button><button class="btn" data-href="approvals.html">PERSETUJUAN</button><button class="btn" id="logout">KELUAR</button></nav></header><main class="wrap"><div class="notice">Tindakan sensitif menggunakan prinsip dua orang. Pembuat permintaan tidak dapat menyetujui permintaannya sendiri.</div><section class="card table-wrap"><table><thead><tr><th>JENIS</th><th>PEMBUAT</th><th>DATA</th><th>KEDALUWARSA</th><th>STATUS</th><th>AKSI</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>let csrf='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function decide(id,decision){let reason='';if(decision==='REJECTED')reason=prompt('Alasan penolakan:','Tidak disetujui')||'';if(!confirm(decision==='APPROVED'?'Setujui dan jalankan tindakan ini?':'Tolak tindakan ini?'))return;try{await ASEAN_API.request('/admin-api/owner/approvals/'+id+'/decision',{method:'POST',headers:{'x-csrf-token':csrf},body:JSON.stringify({decision,reason})});load()}catch(e){alert(e.message)}}async function load(){try{const me=await ASEAN_API.request('/admin-api/owner/me');csrf=me.csrfToken;const data=await ASEAN_API.request('/admin-api/owner/approvals?status=PENDING');rows.innerHTML=data.map(x=>`<tr><td><b>${esc(x.actionType)}</b></td><td>${esc(x.requestedByUsername)}</td><td><pre>${esc(JSON.stringify(x.payload,null,2))}</pre></td><td>${new Date(x.expiresAt).toLocaleString('id-ID')}</td><td><span class="badge">${esc(x.status)}</span></td><td><button class="btn green" data-id="${x.id}" data-decision="APPROVED">SETUJUI</button> <button class="btn red" data-id="${x.id}" data-decision="REJECTED">TOLAK</button></td></tr>`).join('')||'<tr><td colspan="6">Tidak ada permintaan yang menunggu persetujuan.</td></tr>'}catch{location.href='index.html'}}document.querySelectorAll('[data-href]').forEach(b=>b.addEventListener('click',()=>{location.href=b.dataset.href}));rows.addEventListener('click',e=>{const b=e.target.closest('[data-decision]');if(b)decide(b.dataset.id,b.dataset.decision)});logout.onclick=async()=>{await ASEAN_API.request('/admin-api/owner/logout',{method:'POST',headers:{'x-csrf-token':csrf},body:'{}'}).catch(()=>{});location.href='index.html'};load();</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
