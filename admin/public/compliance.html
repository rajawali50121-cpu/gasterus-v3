<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>SBOTOTO Admin | Compliance</title><link href="enterprise.css?v=20261012-admin-r1" rel="stylesheet"/><script src="api.js?v=20261012-admin-api"></script><script src="admin-shell.js?v=20261012-admin-shell"></script>
<link href="enterprise-ui-r6820.css?v=20261012-admin-ui-r6" rel="stylesheet"/>
<link href="enterprise-3d-r7000.css?v=7000-3d-glass" rel="stylesheet"/></head><body class="enterprise-r6820 enterprise-3d-r7000">
<section class="card"><div class="card-head"><div><h2>KYC &amp; Compliance Queue</h2><p>Status verifikasi, risk level, dan akses Player 360. Dokumen mentah tidak disimpan di database ini.</p></div><div class="toolbar"><select class="btn" id="status"><option value="">SEMUA STATUS</option><option>UNVERIFIED</option><option>PENDING</option><option>REVIEW</option><option>VERIFIED</option><option>REJECTED</option></select><button class="btn" id="reload">REFRESH</button></div></div><div class="table-wrap"><table><thead><tr><th>Member</th><th>KYC</th><th>Risk</th><th>Provider</th><th>Reference</th><th>Last Review</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>AdminShell.mount('compliance.html','Compliance Center','KYC workflow • Verification reference • Player risk');const esc=AdminShell.esc;async function load(){const q=status.value?'?status='+encodeURIComponent(status.value):'';const data=await ASEAN_API.request('/admin-api/owner/compliance'+q);rows.innerHTML=data.map(x=>`<tr><td><b>${esc(x.username)}</b><div class="muted">${esc(x.email||'-')}</div></td><td><span class="badge ${esc(x.kycStatus)}">${esc(x.kycStatus)}</span></td><td><b>${esc(x.riskScore)}</b> <span class="badge ${esc(x.riskLevel)}">${esc(x.riskLevel)}</span></td><td>${esc(x.verificationProvider||'-')}</td><td class="mono">${esc(x.verificationReference||'-')}</td><td>${AdminShell.date(x.lastReviewedAt)}</td><td><button class="btn" data-id="${esc(x.id)}">PLAYER 360</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Tidak ada data pada filter ini.</td></tr>'}rows.onclick=e=>{const b=e.target.closest('[data-id]');if(b)location.href='player360.html?id='+encodeURIComponent(b.dataset.id)};status.onchange=()=>load().catch(e=>alert(e.message));reload.onclick=()=>load().catch(e=>alert(e.message));(async()=>{try{await AdminShell.auth();await load()}catch(e){alert(e.message)}})();</script>
<script src="enterprise-ui-r6820.js?v=6820-maxpremium"></script><script src="enterprise-3d-r7000.js?v=7000-3d-glass"></script>
</body></html>
