name: Sportradar Soccer v4 isolated worker

on:
  pull_request:
    paths:
      - "backend/src/sportsbook-next/soccer-v4-*.js"
      - "backend/src/sportsbook-next/results.js"
      - "backend/src/sportsbook-next/results-repository.js"
      - "backend/tests/soccer-v4-worker.test.js"
      - "backend/tests/sportsbook-next-domain.test.js"
      - "backend/tests/schema.test.js"
      - ".github/workflows/soccer-v4-worker-ci.yml"

jobs:
  soccer-v4-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Run Soccer v4 contract, quota, pagination and result tests
        working-directory: backend
        run: node --test tests/soccer-v4-worker.test.js tests/sportsbook-next-domain.test.js tests/schema.test.js && node --check src/sportsbook-next/soccer-v4-worker.js && node --check src/sportsbook-next/soccer-v4-client.js && node --check src/sportsbook-next/soccer-v4-config.js && node --check src/sportsbook-next/soccer-v4-quota.js && node --check src/sportsbook-next/results.js && node --check src/sportsbook-next/results-repository.js
