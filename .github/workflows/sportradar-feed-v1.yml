name: Sportradar Feed v1 CI
# CI runs unit and Redis-backed integration tests on an ephemeral Redis service.

on:
  push:
    branches: [sportradar-feed-v1/build]
    paths:
      - "sportradar-feed-v1/**"
      - ".github/workflows/sportradar-feed-v1.yml"
  pull_request:
    paths:
      - "sportradar-feed-v1/**"
      - ".github/workflows/sportradar-feed-v1.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: sportradar-feed-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check src/api.js && node --check src/worker.js && node --check src/provider.js && node --check src/guard.js && node --check scripts/fetch_fixture.mjs
