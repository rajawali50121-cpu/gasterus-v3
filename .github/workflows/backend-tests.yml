name: Backend and repository checks

on:
  pull_request:
    branches: [master, railway-migration-fix-039, chore/sportradar-only-final]
    paths:
      - "backend/**"
      - "frontend/**"
      - "admin/**"
      - "deploy/**"
      - "scripts/**"
      - "docs/**"
      - "MAINTENANCE.md"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [master, railway-migration-fix-039]
    paths:
      - "backend/**"
      - "frontend/**"
      - "admin/**"
      - "deploy/**"
      - "scripts/**"
      - "docs/**"
      - "MAINTENANCE.md"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gasterus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gasterus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Apply and verify migrations against isolated PostgreSQL 18
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gasterus_test
        run: |
          npm run db:migrate --prefix backend
          npm run db:migrate --prefix backend
          node backend/migrations/verify-sportsbook-v2-go-live.js
      - name: Check backend source syntax
        run: |
          find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check frontend/js/sportsbook-v2.js
          node --check deploy/predeploy.js
          node --check deploy/launcher.js
          node --check scripts/reset-admin-password.mjs
      - name: Run full repository test suite
        run: npm test
      - name: Run repository static checks
        run: npm run check
