name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:ci-postgres@127.0.0.1:5432/gasterus_test
      REDIS_URL: redis://127.0.0.1:6379
      OWNER_USERNAME: ci-owner
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gasterus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gasterus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          set -euo pipefail
          add_secret() {
            printf '::add-mask::%s\n' "$2"
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
          }
          for name in MEMBER_PROXY_SECRET ADMIN_PROXY_SECRET OPS_INTERNAL_SECRET SESSION_HMAC_KEY API_KEY_PEPPER; do
            add_secret "$name" "$(openssl rand -hex 32)"
          done
          add_secret MFA_ENCRYPTION_KEY_BASE64 "$(openssl rand -base64 32 | tr -d '\n')"
          add_secret OWNER_PASSWORD "$(openssl rand -hex 24)"
          add_secret OWNER_TOTP_SECRET "$(openssl rand -base64 32 | tr -dc 'A-Z2-7' | cut -c1-32)"
          add_secret ADMIN_PASSWORD "$(openssl rand -hex 24)"
          add_secret ADMIN_TOTP_SECRET "$(openssl rand -base64 32 | tr -dc 'A-Z2-7' | cut -c1-32)"

      - name: Migrate, seed, and bootstrap test users
        run: |
          npm --prefix backend run db:migrate
          npm --prefix backend run db:seed
          node backend/migrations/bootstrap-owner.js > /dev/null
          ADMIN_USERNAME=ci-supervisor node backend/migrations/bootstrap-admin.js > /dev/null

      - name: Start local mock sportsbook provider
        shell: bash
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/mock-provider.crt"
          key="$RUNNER_TEMP/mock-provider.key"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$key" -out "$cert" \
            -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          printf 'NODE_EXTRA_CA_CERTS=%s\n' "$cert" >> "$GITHUB_ENV"
          MOCK_ODDS_CERT="$cert" MOCK_ODDS_KEY="$key" \
            node scripts/sportsbook-stress-mock.mjs > "$RUNNER_TEMP/mock-provider.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --cacert "$cert" https://localhost:8443/__stats; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mock-provider.log"
          exit 1

      - name: Run complete unit test suite
        run: npm test

      - name: Run database and provider integration checks
        env:
          SPORTMONKS_API_KEY: ci-mock-sportmonks
          SPORTMONKS_BASE_URL: https://localhost:8443/v3
          SPORTMONKS_DAYS_AHEAD: "0"
          SPORTMONKS_ENABLED: "true"
          SPORTMONKS_MAX_PAGES_PER_REFRESH: "1"
          SPORTMONKS_REQUEST_DELAY_MS: "0"
          THE_ODDS_API_BASE_URL: https://localhost:8443/v4
          THE_ODDS_API_ENABLED: "true"
          THE_ODDS_API_KEY: ci-mock-odds
          THE_ODDS_API_MAX_TOTAL_EVENTS: "500"
          THE_ODDS_API_SPORT_KEYS: soccer_epl
          THE_ODDS_API_EVENT_MARKETS_ENABLED: "false"
        run: |
          node backend/migrations/integration-smoke.js
          node backend/migrations/provider-smoke.js

      - name: Check syntax and production asset versions
        run: npm run check
