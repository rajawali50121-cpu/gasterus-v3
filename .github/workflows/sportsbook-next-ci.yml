name: Sportradar sportsbook tests

on:
  push:
    branches: [fix/production-sportradar-discovery-429]
    paths:
      - "backend/src/sportsbook-next/**"
      - "backend/tests/sportsbook-next-foundation.test.js"
      - "backend/tests/sportsbook-next-discovery.test.js"
      - "deploy/Dockerfile.sportsbook-v2-worker"
      - ".github/workflows/sportsbook-next-ci.yml"
  pull_request:
    paths:
      - "backend/src/sportsbook-next/**"
      - "backend/tests/sportsbook-next-foundation.test.js"
      - "backend/tests/sportsbook-next-discovery.test.js"
      - ".github/workflows/sportsbook-next-ci.yml"

jobs:
  sportsbook-next-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Run Sportradar sportsbook foundation tests
        working-directory: backend
        run: node --test tests/sportsbook-next-foundation.test.js tests/sportsbook-next-discovery.test.js && node --check src/sportsbook-next/worker.js && node --check src/sportsbook-next/discovery.js
