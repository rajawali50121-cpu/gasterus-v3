name: Sportradar sportsbook tests

on:
  pull_request:
    paths:
      - "backend/src/sportsbook-next/**"
      - "backend/migrations/042_sportsbook_v2_core.sql"
      - "backend/migrations/043_sportsbook_v2_provider_timestamps.sql"
      - "backend/migrations/044_sportsbook_v2_market_results_settlement.sql"
      - "backend/migrations/045_sportsbook_v2_result_receipt_times.sql"
      - "backend/tests/sportsbook-next-foundation.test.js"
      - "backend/tests/sportsbook-next-domain.test.js"
      - "backend/tests/soccer-v4-worker.test.js"
      - "deploy/Dockerfile.soccer-v4-worker"
      - "backend/tests/schema.test.js"
      - ".github/workflows/sportsbook-next-ci.yml"

jobs:
  sportsbook-next-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Run Sportradar foundation and schema tests
        working-directory: backend
        run: node --test tests/sportsbook-next-foundation.test.js tests/sportsbook-next-domain.test.js tests/soccer-v4-worker.test.js tests/schema.test.js && node --check src/sportsbook-next/worker.js && node --check src/sportsbook-next/soccer-v4-worker.js && node --check src/sportsbook-next/soccer-v4-client.js && node --check src/sportsbook-next/soccer-v4-config.js && node --check src/sportsbook-next/soccer-v4-quota.js && node --check src/sportsbook-next/repository.js && node --check src/sportsbook-next/results-repository.js && node --check src/sportsbook-next/market-catalog.js && node --check src/sportsbook-next/results.js && node --check src/sportsbook-next/settlement-rules.js && node --check src/sportsbook-next/index.js
